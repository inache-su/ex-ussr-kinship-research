skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: state_lives_in_research_state
    request: "Куда записать, что осталось проверить, что заблокировано и какой ответ мы ждём из архива?"
    expected:
      - "Вести очередь, блокировки, решения пользователя и отправленные запросы в research-state.md по шаблону."
      - "Не дописывать ход работы в case-intake.yaml и не заводить для этого отдельные заметки."
      - "Не копировать в план содержимое реестров."

  - id: target_budget_switch
    request: "По одному человеку выполнено 150 поисков в Яндекс Архиве, найдено три сомнительных совпадения. Нужный акт 1935 года хранится в областном ЗАГС."
    expected:
      - "Не продолжать листание той же выдачи без нового основания."
      - "Подготовить запрос в ЗАГС по шагу 6б и перейти к другой ветви, записав это в план."
      - "Сохранить сомнительные совпадения как отдельных кандидатов, не объединяя их с искомым человеком."

  - id: side_branch_before_page_by_page
    request: "Нашлась книга на 400 страниц по соседнему селу, где могли жить однофамильцы. Решающий акт из мэрии ещё не пришёл."
    expected:
      - "Перед чтением назвать, кого из людей дела эта книга свяжет или различит."
      - "Учесть, что более дешёвый решающий документ уже ожидается; без связи с делом отложить книгу в очередь."

  - id: requester_asked_once
    request: "Для четвёртого запроса в архив снова нужны имя латиницей, адрес и тип удостоверения заявителя."
    expected:
      - "Взять данные из requester в case-intake.yaml, не спрашивая пользователя повторно."
      - "При free_institution_requests_preauthorized: true отправить бесплатный запрос без отдельного согласования; платный — только после подтверждения."

  - id: search_log_one_row_per_query
    request: "Как записать в журнал 12 страниц выдачи по одному запросу, если на седьмой странице нашлась запись?"
    expected:
      - "Одна строка с result_status found, диапазоном страниц в filters и artifact_ids найденной записи."
      - "В source_or_domain указать домен сайта, а не название инструмента поиска."

  - id: claims_are_about_people
    request: "Записать в claims-register, что запрос в архив отправлен и что в описи нет нужного прихода?"
    expected:
      - "Состояние запроса вести в research-state.md, покрытие описи — в search-log.csv."
      - "В claims-register вносить утверждения о людях, событиях и связях, опираясь на исходные документы, а не на заметки агента."

  - id: user_correction_parsed
    request: "Пользователь поправил: историю рассказывала его мать со слов бабушки, а не сама бабушка, и Олег — сын старшей сестры, а не младшей."
    expected:
      - "Обновить цепочку передачи и информанта семейного свидетельства."
      - "Оформить уточнение новым утверждением, сохранив прежнее с пометкой о противоречии."
      - "Пересмотреть связи, опиравшиеся на прежнюю версию."

  - id: video_without_viewing
    request: "Нашлось видео на YouTube о прадеде, но посмотреть его инструмент не может."
    expected:
      - "Прочитать описание и субтитры или автоматическую расшифровку, если доступен yt-dlp и это допускают правила площадки."
      - "Ссылаться на таймкоды и не применять распознавание лиц."

  - id: notes_are_working_materials
    request: "Нужно ли каждую заметку дела прогонять через внешнее редакторское ревью?"
    expected:
      - "Считать заметки, реестры, план и промежуточные сообщения рабочими материалами."
      - "Редакторские проверки применять к итоговому отчёту, версии для обмена и письмам."
      - "Служебные файлы хранить в working/, а не в originals/."

  - id: hypothesis_mode_request
    request: "Найди всех родственников, даже гипотетических, связывай их с пометкой, потом уточним."
    expected:
      - "Записать решение пользователя в плане и вести связи со статусом hypothesis и типом из словаря."
      - "В rationale указать конкурирующие варианты, основание (фамилия и хотя бы один признак помимо фамилии, имени и отчества) и решающую проверку."
      - "Не строить гипотезы дальше одного звена от субъекта дела или подтверждённой связи; показать гипотезы в таблице отчёта и пунктиром на схеме."

  - id: index_row_without_age
    request: "Строка индекса смертей без возраста называет человека с нужным именем и отчеством. Записать его отцом?"
    expected:
      - "Проверить возраст по записи, где он указан, прежде чем делать человека родителем."
      - "До проверки оставить строку наводкой в журнале."

  - id: marriage_index_line
    request: "В индексе браков одна строка: два однофамильца из того же района. Завести пару в реестре?"
    expected:
      - "Не заводить person_id и связь spouse-of, пока хотя бы один из супругов не связан с делом."

  - id: paid_archive_before_payment
    request: "Архив предлагает абонемент на три часа. В очереди книги 1893–1906 годов, а искомые рождения — 1943 и 1946."
    expected:
      - "До оплаты сообщить, что эти книги не ответят на вопрос о рождениях 1943 и 1946 годов."
      - "Активировать доступ только по решению пользователя, записанному в плане; время в UTC и стоимость — в журнал."
      - "Проверить условия копирования перед массовым сохранением кадров."

  - id: unlinked_lead_budget
    request: "Человек из некролога пока не связан с делом. Сколько ещё искать о нём и на кого записывать поиски?"
    expected:
      - "Около 10 поисков на человека без связи с делом."
      - "В target_person_ids указывать именно его; пустую выдачу не регистрировать как артефакт."

  - id: tree_page
    request: "Сделай HTML-страницу с деревом по тому, что уже собрано."
    expected:
      - "Запустить scripts/build_tree.py; для передачи семье — с --shared."
      - "Объединять людей только в person-register.csv, не в настройках страницы."

  - id: patronymic_forms
    request: "В метрике отчество записано церковной формой, в военной карточке — бытовой. Искать их как разных людей?"
    expected:
      - "Считать формы вариантами одного кандидата и искать их одной серией."
